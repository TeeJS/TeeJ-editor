name: CI_build

# TeeJ-editor CI: every push / PR must (1) still contain no network or updater
# code paths, and (2) build x64 Release under /W4 warnings-as-errors.
# This is the gate for upstream-merge PRs opened by upstream-watch.yml.

on:
  push:
    branches: ['teej-editor', 'upstream-merge/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress_guard:
    name: Egress guard (no network / updater code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan source and installer
        run: bash .github/scripts/egress-guard.sh

  build_windows:
    name: Build x64 Release
    runs-on: windows-latest
    needs: egress_guard
    steps:
      - uses: actions/checkout@v6

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: MSBuild TeeJ-editor (solution builds Scintilla + Lexilla first)
        working-directory: PowerEditor\visual.net\
        run: msbuild notepadPlus.sln /m /p:configuration=Release /p:platform=x64

      - name: Verify output identity
        run: |
          $exe = "PowerEditor\bin64\TeeJ-editor.exe"
          if (-not (Test-Path $exe)) { throw "TeeJ-editor.exe was not produced" }
          $vi = (Get-Item $exe).VersionInfo
          "ProductName=$($vi.ProductName)  OriginalFilename=$($vi.OriginalFilename)  Version=$($vi.ProductVersion)"
          if ($vi.ProductName -ne 'TeeJ-editor') { throw "ProductName is '$($vi.ProductName)', expected TeeJ-editor" }
          # Locate dumpbin (not on PATH on the runner; setup-msbuild only adds MSBuild).
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsroot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsroot\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -eq 'Hostx64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsroot" }
          # The exe must not import any network DLL.
          $imports = & $dumpbin /dependents $exe | Select-String -Pattern '^\s+\S+\.dll' | ForEach-Object { $_.Matches.Value.Trim().ToLower() }
          "Imports: $($imports -join ', ')"
          $bad = $imports | Where-Object { $_ -match '^(winhttp|ws2_32|wsock32|urlmon|libcurl)' }
          if ($bad) { throw "Network DLL imported: $($bad -join ', ')" }
          # wininet.dll is allowed only for InternetCrackUrl (URL parsing); make sure that is all.
          if ($imports -contains 'wininet.dll') {
            $fn = & $dumpbin /imports $exe | Select-String -Pattern 'Internet\w+|Http\w+' | ForEach-Object { $_.Matches.Value } | Sort-Object -Unique
            "wininet imports: $($fn -join ', ')"
            $extra = $fn | Where-Object { $_ -ne 'InternetCrackUrlW' -and $_ -ne 'InternetCrackUrlA' }
            if ($extra) { throw "Unexpected wininet import(s): $($extra -join ', ')" }
          }

      - name: Upload artifact (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: TeeJ-editor.x64.Release.unsigned
          path: PowerEditor\bin64\TeeJ-editor.exe
